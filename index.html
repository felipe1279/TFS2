<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TFS2 Build Lab</title>
<style>
:root{--bg:#e8ecef;--pn:#f7f9fa;--ink:#17212b;--mu:#5d6b78;--ln:#c5ced6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Bahnschift","Roboto Condensed","Arial Narrow",system-ui,sans-serif}
header{display:flex;gap:24px;align-items:center;padding:8px 20px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:.04em}h2{font-size:18px;margin:20px 0 8px}h3{font-size:15px;margin:14px 0 4px}
button,input,select,textarea{font:inherit;color:inherit;background:#fff;border:1px solid var(--ln);border-radius:2px;padding:5px 8px}
button{cursor:pointer}button:hover{border-color:var(--ink)}:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
header button{background:none;border:0;color:#cbd5de;font-size:16px}header button.on{color:#fff;box-shadow:inset 0 -3px #fff}
main{padding:16px 20px;max-width:1400px;margin:auto}[hidden]{display:none!important}.mu{color:var(--mu);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}#tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}#tabs button.on{background:var(--ink);color:#fff}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card,.slot{background:var(--pn);border:1px solid var(--ln);border-left:5px solid var(--c,var(--ln));padding:8px}.card h3{margin:6px 0 2px}
.chips i{font-style:normal;font-size:12px;background:#e1e7ec;padding:1px 6px;margin:2px 2px 0 0;display:inline-block}
.c-vermelha{--c:#c62f33}.c-azul{--c:#1f6fd1}.c-verde{--c:#1f9d4f}.c-amarela{--c:#d99a00}.c-roxa{--c:#7b4fd0}
.im{position:relative;aspect-ratio:1;border:2px solid var(--c,var(--ln));background:#fff;display:grid;place-items:center;text-align:center;font-size:13px;padding:4px;cursor:help}
.im small{display:block;color:var(--mu);font-size:11px}.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.im::after{content:attr(data-tip);position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:4px;width:max-content;max-width:220px;background:var(--ink);color:#fff;padding:5px 8px;font-size:13px;opacity:0;pointer-events:none;z-index:9}
.im:hover::after,.im:focus::after{opacity:1}
#slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:10px 0}.slot.lock{opacity:.5}.slot select{width:100%;margin:4px 0}.slot .im{width:76px;margin-bottom:4px}
.slot button.essencial{background:var(--ink);color:#fff}.slot button.adicional{background:#9aa7b3}
#bar{display:flex;height:22px;border:1px solid var(--ln);background:#fff}.es{background:var(--ink)}.ad{background:#9aa7b3}.ve{background:#fff}
.ck{display:inline-flex;gap:4px;align-items:center;margin-right:8px}.dot{display:inline-block;width:10px;height:10px;background:var(--c);margin-right:4px}
.st{font-size:12px;border:1px solid var(--mu);padding:0 5px}.t-conflitante{color:#c62f33}.t-redundante{color:#a56f00}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}form .w{grid-column:1/-1}label{display:grid;gap:2px;font-size:13px;color:var(--mu)}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--ln);padding:5px 6px;text-align:left}
</style></head><body>
<header><h1>TFS2 Build Lab</h1><nav id=nav><button data-v=cat class=on>Catálogo</button><button data-v=bld>Build Creator</button><button data-v=mng>Gerenciar Perks</button></nav></header>
<main id=cat class=v><div class=bar><input id=q type=search placeholder="Pesquisar em todos os dados do perk" size=36><select id=fc></select><select id=fa></select></div><div id=tabs></div><div id=grid></div></main>
<main id=bld class=v hidden>
<div id=info class=bar><input data-k=nome placeholder="Nome da build"><input data-k=arma placeholder="Arma principal"><input data-k=mapa placeholder="Mapa"><input data-k=dificuldade placeholder="Dificuldade"><input data-k=objetivo placeholder="Objetivo" size=28><input data-k=descricao placeholder="Descrição" size=28></div>
<div id=bar></div><p id=barT></p><div id=slots></div>
<div class=bar><button id=sv>Salvar build</button><button id=nw>Nova build</button><button id=xb>Exportar JSON</button><label class=ck>Importar JSON <input id=ib type=file accept=.json></label></div>
<div class=bar><select id=fo><option value=equilibrado>Foco: equilibrado</option><option value=dano>Foco: máximo dano</option><option value=critico>Foco: crítico</option><option value=sobrevivencia>Foco: sobrevivência</option><option value=mobilidade>Foco: mobilidade</option><option value=economia>Foco: economia</option><option value=sniper>Foco: sniper</option><option value=melee>Foco: melee</option><option value=explosoes>Foco: explosões</option></select><button id=xi>Exportar imagem</button></div>
<div id=ex hidden><canvas id=cv style="max-width:100%"></canvas><div class=bar><button id=ci>Copiar imagem</button><button id=di>Baixar PNG</button><button id=ct>Copiar descrição textual</button></div></div>
<ul id=bl></ul><section id=an></section></main>
<main id=mng class=v hidden><h2>Adicionar ou editar perk</h2>
<form id=pf onsubmit="savePerk(event)"><input type=hidden name=eid>
<label>Nome<input name=nome required></label><label>Cor<select name=cor></select></label>
<label class=w>Descrição original<textarea name=dorig rows=3></textarea></label>
<label class=w>Descrição simplificada (aparece na dica da imagem)<textarea name=dsimp rows=2></textarea></label>
<label>Nível 1<input name=n1></label><label>Nível 2<input name=n2></label><label>Nível 3<input name=n3></label><label>Nível 4<input name=n4></label>
<label>Arquivo da imagem<input name=img placeholder="assets/perks/nome-do-perk.png"></label><label>Enviar imagem<input type=file name=imgf accept="image/*"></label><label class=ck><input type=checkbox name=imgok> A imagem já está na pasta</label>
<div class=w id=cats></div><div class=w><button>Salvar perk</button> <button type=reset>Limpar</button></div></form>
<h2>Usar uma IA sem conectar o Drive</h2>
<p class=mu>Baixe o pacote, anexe-o ao chat (ou a um Project) e peça a análise. Para atualizar a base, cole abaixo o JSON que a IA devolver.</p>
<div class=bar><button type=button onclick="location.href='/api/pacote'">Exportar para IA</button></div>
<label>Atualização devolvida pela IA (JSON)<textarea id=pt rows=5></textarea></label><div class=bar><button id=ap type=button>Aplicar atualização</button></div>
<h2>Perks cadastrados</h2><div class=bar><button id=xp>Exportar perks.json</button><label class=ck>Importar perks.json <input id=ip type=file accept=.json></label></div>
<table><thead><tr><th>Perk<th>Cor<th>Pendências<th></thead><tbody id=pl></tbody></table></main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
api=(k,m='GET',b)=>fetch('/api/'+k,{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b,null,2)}).then(r=>m==='GET'?r.json():r.text()),
slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),
txt=o=>o&&typeof o==='object'?Object.values(o).map(txt).join(' '):String(o??''),
dl=(n,o)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download=n;a.click()},
COR=['vermelha','azul','verde','amarela','roxa'],RULE=Array(8).fill(null).concat(['vermelha','azul','verde','amarela']);
let perks=[],builds=[],tags={},tab='todos',cur;
const byId=id=>perks.find(p=>p.id===id),
newBuild=()=>({id:'b'+Date.now(),nome:'Nova build',descricao:'',objetivo:'',arma:'',mapa:'',dificuldade:'',desbloqueados:Array(12).fill(true),slots:Array(12).fill(null)}),
pend=p=>[!p.descricao_simples&&'descrição simples',!(p.categorias||[]).length&&'categorias',!(p.atributos||[]).length&&'atributos',(p.imagem||{}).status!=='encontrada'&&'imagem',(p.revisao||{}).sinergias==='pendente'&&'sinergias'].filter(Boolean),
im=p=>`<div class="im c-${p.cor}" tabindex=0 data-tip="${esc(p.descricao_simples||'Descrição pendente.')}"><span>${esc(p.nome)}<small>imagem pendente</small></span>${p.imagem&&p.imagem.status==='encontrada'?`<img src="/${esc(p.imagem.arquivo)}" alt="" onerror="this.remove()">`:''}</div>`,
card=p=>`<article class="card c-${p.cor}">${im(p)}<h3>${esc(p.nome)}</h3><div class=mu>${esc(tags.cores[p.cor]||p.cor)}</div><div class=chips>${(p.categorias||[]).map(k=>`<i>${esc(tags.categorias[k]||k)}</i>`).join('')}</div></article>`;
$('#nav').onclick=e=>{const v=e.target.dataset.v;if(!v)return;$$('.v').forEach(x=>x.hidden=x.id!==v);$$('#nav button').forEach(b=>b.classList.toggle('on',b===e.target))};
function renderCat(){
 const q=$('#q').value.toLowerCase(),c=$('#fc').value,a=$('#fa').value;
 $('#tabs').innerHTML=[['todos','Todos os perks'],...Object.entries(tags.categorias),['sinergias','Sinergias']].map(([k,n])=>`<button data-t="${k}" class="${k===tab?'on':''}">${esc(n)}</button>`).join('');
 const L=perks.filter(p=>(!q||txt(p).toLowerCase().includes(q))&&(!c||p.cor===c)&&(!a||(p.atributos||[]).some(x=>x.tipo===a))&&(tab==='todos'||(tab==='sinergias'?(p.sinergias||[]).length:(p.categorias||[]).includes(tab))));
 $('#grid').innerHTML=L.map(card).join('')||'<p class=mu>Nenhum perk encontrado. Cadastre perks em Gerenciar Perks.</p>'}
$('#tabs').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;renderCat()}};['#q','#fc','#fa'].forEach(s=>$(s).oninput=renderCat);
function renderMng(){$('#pl').innerHTML=perks.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(tags.cores[p.cor]||p.cor)}</td><td>${pend(p).join(', ')||'completo'}</td><td><button data-e="${esc(p.id)}">Editar</button> <button data-r="${esc(p.id)}">Remover</button></td></tr>`).join('')||'<tr><td colspan=4 class=mu>Nenhum perk cadastrado. Preencha o formulário acima.</td></tr>'}
async function savePerk(e){e.preventDefault();const f=e.target,id=f.eid.value||slug(f.nome.value);
 if(!f.eid.value&&byId(id)){alert('Já existe um perk com este identificador.');return}
 const fi=f.imgf.files[0];let up=null;if(fi){up=id+'.'+(fi.name.split('.').pop()||'png').toLowerCase();const r=await fetch('/api/upload?name='+up,{method:'POST',body:fi});if(!r.ok){alert('Falha no envio da imagem: '+await r.text());return}}
 const o=byId(id)||{id,atributos:[],condicoes:[],restricoes:[],sinergias:[],fontes:[],ultima_verificacao:null,revisao:{descricao:'pendente',categorias:'pendente',sinergias:'pendente',imagem:'pendente',status:'incompleto'}};
 Object.assign(o,{nome:f.nome.value.trim(),cor:f.cor.value,descricao_original:f.dorig.value,descricao_simples:f.dsimp.value,niveis:{1:f.n1.value,2:f.n2.value,3:f.n3.value,4:f.n4.value},categorias:[...f.querySelectorAll('[name=cat]:checked')].map(x=>x.value),imagem:{arquivo:up?`assets/perks/${up}`:(f.img.value||`assets/perks/${id}.png`),fonte:(o.imagem||{}).fonte||'',status:up||f.imgok.checked?'encontrada':'pendente'}});
 if(!byId(id))perks.push(o);
 await api('perks','PUT',perks);f.reset();f.eid.value='';renderCat();renderMng();renderBld()}
function editPerk(id){const p=byId(id),f=$('#pf'),i=p.imagem||{};f.eid.value=id;f.nome.value=p.nome;f.cor.value=p.cor;f.dorig.value=p.descricao_original||'';f.dsimp.value=p.descricao_simples||'';[1,2,3,4].forEach(n=>f['n'+n].value=(p.niveis||{})[n]||'');f.img.value=i.arquivo||'';f.imgok.checked=i.status==='encontrada';f.querySelectorAll('[name=cat]').forEach(x=>x.checked=(p.categorias||[]).includes(x.value));scrollTo(0,0)}
$('#pl').onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.e)editPerk(b.dataset.e);
 if(b.dataset.r&&confirm('Remover este perk? Um backup do JSON será criado.')){perks=perks.filter(p=>p.id!==b.dataset.r);await api('perks','PUT',perks);renderCat();renderMng();renderBld()}};
$('#xp').onclick=()=>dl('perks.json',perks);
$('#ip').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j)||j.some(p=>!p.id||!p.nome))throw 0;
 if(confirm(`Substituir os ${perks.length} perks atuais por ${j.length} perks? Um backup será criado.`)){perks=j;await api('perks','PUT',perks);renderCat();renderMng();renderBld()}}catch{alert('Arquivo inválido: esperado um array de perks com id e nome.')}e.target.value=''};
function analyze(){
 const eq=cur.slots.map(s=>s&&byId(s.perk)?{...s,p:byId(s.perk)}:null).filter(Boolean);
 if(!eq.length)return '<p class=mu>Escolha perks para ver cores, atributos e sinergias.</p>';
 const ids=eq.map(x=>x.perk),at={},H=(t,b)=>`<h3>${t}</h3>${b}`,L=a=>a.length?`<ul>${a.join('')}</ul>`:'<p class=mu>Nada registrado na base.</p>';
 eq.forEach(x=>(x.p.atributos||[]).filter(a=>a.nivel==null||a.nivel===x.nivel).forEach(a=>(at[a.tipo]=at[a.tipo]||[]).push({...a,de:x.p.nome})));
 const A=Object.entries(at).map(([t,l])=>{const u=esc(l[0].unidade||''),ok=l.every(a=>a.acumulacao==='aditiva'&&typeof a.valor==='number');return `<li><b>${esc(t)}</b>: ${l.map(a=>`${esc(a.de)} ${esc(a.valor)}${u}`).join(' + ')}${ok?` = <b>${l.reduce((s,a)=>s+a.valor,0)}${u}</b>`:' <span class=mu>(não somado: acúmulo não confirmado, exige teste)</span>'}</li>`}),
 S=eq.flatMap(x=>(x.p.sinergias||[]).filter(s=>s.estado!=='rejeitada'&&ids.includes(s.com)).map(s=>`<li class="t-${esc(s.tipo)}"><b>${esc(x.p.nome)}</b> com <b>${esc(byId(s.com).nome)}</b>: ${esc(s.tipo)} <span class=st>${esc(s.estado)}</span>${s.estado==='verificada'?'':' <span class=mu>hipótese, não confirmada</span>'}<br>${esc(s.motivo||'')} ${s.condicoes?'Condições: '+esc(s.condicoes)+'.':''} ${s.limitacoes?'Limites: '+esc(s.limitacoes)+'.':''}</li>`)),
 G=[...new Set(eq.flatMap(x=>(x.p.sinergias||[]).filter(s=>s.estado!=='rejeitada'&&byId(s.com)&&!ids.includes(s.com)&&!['conflitante','redundante'].includes(s.tipo)).map(s=>s.com)))].sort((a,b)=>fit(byId(b))-fit(byId(a))).map(i=>`<li>${esc(byId(i).nome)}${fit(byId(i))?' <span class=st>alinhado ao foco</span>':''}</li>`),
 C=eq.flatMap(x=>(x.p.condicoes||[]).map(c=>`<li><b>${esc(x.p.nome)}</b>: ${esc(typeof c==='string'?c:JSON.stringify(c))}</li>`));
 return (FOCO[cur.foco]?H('Contribuição ao foco',L(eq.map(x=>`<li><b>${esc(x.p.nome)}</b>: ${fit(x.p)?'contribui para o foco':'sem relação direta com o foco'}</li>`))+'<p class=mu>O foco só orienta a leitura; não prova sinergia.</p>'):'')+H('Cores',`<p>${COR.map(c=>[c,eq.filter(x=>x.p.cor===c).length]).filter(c=>c[1]).map(([c,n])=>`<span class="c-${c}"><span class=dot></span>${n} ${esc(tags.cores[c])}</span>`).join(' &nbsp; ')}</p>`)+H('Atributos nos níveis escolhidos',L(A))+H('Sinergias, conflitos e redundâncias entre os perks equipados',L(S))+H('Condições a verificar na build',L(C))+H('Perks da base que complementam esta build',L(G))+'<p class=mu>Valores finais, DPS e interações não registradas exigem teste no jogo.</p>'}
function renderBld(){
 const B=cur,eq=B.slots.filter(s=>s&&byId(s.perk)),es=eq.filter(s=>s.papel==='essencial').length,ad=eq.length-es,ve=B.desbloqueados.filter(Boolean).length-eq.length;
 $('#bar').innerHTML=[['es',es],['ad',ad],['ve',ve]].map(([k,n])=>`<span class="${k}" style="flex:${n}"></span>`).join('');
 $('#barT').textContent=`${es} essenciais | ${ad} adicionais | ${ve} vazios`;
 $('#slots').innerHTML=B.slots.map((s,i)=>{const r=RULE[i],ok=B.desbloqueados[i],p=s&&byId(s.perk);
  const o=perks.filter(x=>!r||x.cor===r).map(x=>`<option value="${esc(x.id)}"${p&&p.id===x.id?' selected':''}>${esc(x.nome)}</option>`).join('');
  return `<div class="slot ${r?'c-'+r:''}${ok?'':' lock'}" data-i="${i}"><label class=ck><input type=checkbox name=lock ${ok?'checked':''}> Slot ${i+1}: ${esc(r?tags.cores[r]:'livre')}</label>${p?im(p):''}<select name=perk ${ok?'':'disabled'}><option value="">(vazio)</option>${o}</select>${p?`<select name=lvl>${[1,2,3,4].map(n=>`<option value=${n}${s.nivel===n?' selected':''}>Nível ${n}</option>`).join('')}</select><button name=role class="${s.papel}">${s.papel==='essencial'?'Essencial':'Adicional'}</button> <button name=rm>Remover</button><div class=mu>${esc((p.niveis||{})[s.nivel]||'')}</div>`:''}</div>`}).join('');
 $('#an').innerHTML=analyze();
 $('#bl').innerHTML=builds.map(b=>`<li>${esc(b.nome)} <button data-l="${esc(b.id)}">Abrir</button> <button data-d="${esc(b.id)}">Duplicar</button> <button data-x="${esc(b.id)}">Excluir</button></li>`).join('')||'<li class=mu>Nenhuma build salva.</li>'}
$('#slots').onchange=e=>{const t=e.target,i=+t.closest('.slot').dataset.i,B=cur,s=B.slots[i];
 if(t.name==='lock'){B.desbloqueados[i]=t.checked;if(!t.checked)B.slots[i]=null}
 else if(t.name==='perk'){if(t.value&&B.slots.some((x,j)=>j!==i&&x&&x.perk===t.value)){alert('Este perk já está em outro slot.');return renderBld()}
  B.slots[i]=t.value?{perk:t.value,nivel:(s||{}).nivel||1,papel:(s||{}).papel||'essencial'}:null}
 else if(t.name==='lvl')s.nivel=+t.value;
 renderBld()};
$('#slots').onclick=e=>{const t=e.target.closest('button');if(!t)return;const i=+t.closest('.slot').dataset.i,s=cur.slots[i];
 if(t.name==='role')s.papel=s.papel==='essencial'?'adicional':'essencial';if(t.name==='rm')cur.slots[i]=null;renderBld()};
const setCur=b=>{b.slots=Array.from({length:12},(_,i)=>{const s=b.slots&&b.slots[i],p=s&&byId(s.perk);return p&&(!RULE[i]||p.cor===RULE[i])?s:null});b.desbloqueados=b.desbloqueados||Array(12).fill(true);cur=b;$$('#info [data-k]').forEach(x=>x.value=cur[x.dataset.k]||'');$('#fo').value=cur.foco||'equilibrado';renderBld()},
saveBuilds=()=>api('builds','PUT',builds).then(renderBld);
$('#info').oninput=e=>{cur[e.target.dataset.k]=e.target.value};
$('#sv').onclick=async()=>{const i=builds.findIndex(b=>b.id===cur.id);i<0?builds.push(structuredClone(cur)):builds[i]=structuredClone(cur);await saveBuilds()};
$('#nw').onclick=()=>setCur(newBuild());$('#xb').onclick=()=>dl('builds.json',builds);
$('#bl').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset,f=builds.find(x=>x.id===(D.l||D.d||D.x));
 if(D.l)setCur(structuredClone(f));
 if(D.d){builds.push({...structuredClone(f),id:'b'+Date.now(),nome:f.nome+' (cópia)'});await saveBuilds()}
 if(D.x&&confirm('Excluir esta build?')){builds=builds.filter(x=>x!==f);await saveBuilds()}};
$('#ib').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j))throw 0;builds=builds.concat(j.map(b=>({...b,id:'b'+Date.now()+Math.random().toString(36).slice(2,6)})));await saveBuilds()}catch{alert('Arquivo inválido: esperado um array de builds.')}e.target.value=''};
const FOCO={dano:['dano',['weapon_damage','critical_damage','melee_damage','explosive_damage','equipment_damage']],critico:['critico',['critical_chance','critical_damage']],sobrevivencia:['defesa',['armor','resistance','health_regeneration']],mobilidade:['corrida',['movement_speed','stamina']],economia:['economia',['money']],sniper:['sniper',['weapon_damage','critical_damage','weapon_control']],melee:['melee',['melee_damage','attack_speed']],explosoes:['explosao',['explosive_damage']]};
const fit=p=>{const f=FOCO[cur.foco];return !!f&&((p.categorias||[]).includes(f[0])||(p.atributos||[]).some(x=>f[1].includes(x.tipo)))};
$('#fo').onchange=e=>{cur.foco=e.target.value;renderBld()};
async function drawBuild(){
 const eq=cur.slots.map(s=>s&&byId(s.perk)?{s,p:byId(s.perk)}:null).filter(Boolean),
 imgs=await Promise.all(eq.map(x=>new Promise(r=>{const i=x.p.imagem||{};if(i.status!=='encontrada')return r(null);const m=new Image();m.onload=()=>r(m);m.onerror=()=>r(null);m.src='/'+i.arquivo}))),
 K={vermelha:'#c62f33',azul:'#1f6fd1',verde:'#1f9d4f',amarela:'#d99a00',roxa:'#7b4fd0'},S=96,P=16,N=6,W=N*(S+P)+P,FT='"Bahnschrift","Arial Narrow",sans-serif',
 gr=['essencial','adicional'].map(t=>[t,eq.map((x,i)=>({...x,m:imgs[i]})).filter(x=>x.s.papel===t)]).filter(g=>g[1].length),
 H=70+gr.reduce((h,g)=>h+34+Math.ceil(g[1].length/N)*(S+P+22),0)+P,cv=$('#cv'),c=cv.getContext('2d');
 cv.width=W;cv.height=H;c.fillStyle='#f7f9fa';c.fillRect(0,0,W,H);c.fillStyle='#17212b';c.fillRect(0,0,W,52);
 c.fillStyle='#fff';c.font='700 26px '+FT;c.fillText(cur.nome||'Build',P,35);
 let y=70;
 gr.forEach(([t,L])=>{c.fillStyle='#17212b';c.font='700 18px '+FT;c.fillText(t==='essencial'?'Essenciais':'Adicionais',P,y+18);y+=34;
  L.forEach((x,k)=>{const cx=P+k%N*(S+P),cy=y+Math.floor(k/N)*(S+P+22);
   c.fillStyle='#fff';c.fillRect(cx,cy,S,S);
   if(x.m)c.drawImage(x.m,cx,cy,S,S);else{c.fillStyle='#5d6b78';c.font='13px '+FT;c.textAlign='center';c.fillText(x.p.nome.slice(0,14),cx+S/2,cy+S/2);c.textAlign='left'}
   c.strokeStyle=K[x.p.cor];c.lineWidth=4;c.strokeRect(cx+2,cy+2,S-4,S-4);
   c.fillStyle=K[x.p.cor];c.fillRect(cx+S-36,cy+S-22,34,20);c.fillStyle='#fff';c.font='700 13px '+FT;c.fillText('Nv '+x.s.nivel,cx+S-33,cy+S-7);
   c.fillStyle='#17212b';c.font='13px '+FT;c.fillText(x.p.nome.slice(0,16),cx,cy+S+16)});
  y+=Math.ceil(L.length/N)*(S+P+22)});
 $('#ex').hidden=false}
$('#xi').onclick=drawBuild;
$('#di').onclick=()=>{const a=document.createElement('a');a.href=$('#cv').toDataURL('image/png');a.download=(slug(cur.nome||'build')||'build')+'.png';a.click()};
$('#ci').onclick=()=>$('#cv').toBlob(b=>navigator.clipboard.write([new ClipboardItem({'image/png':b})]).then(()=>alert('Imagem copiada.'),()=>alert('Não foi possível copiar a imagem. Use Baixar PNG.')));
$('#ct').onclick=()=>{const eq=cur.slots.map(s=>s&&byId(s.perk)?{s,p:byId(s.perk)}:null).filter(Boolean),ln=t=>eq.filter(x=>x.s.papel===t).map(x=>`- ${x.p.nome} (nível ${x.s.nivel})`).join('\n')||'- nenhum';
 navigator.clipboard.writeText(`${cur.nome||'Build'}${cur.arma?' | '+cur.arma:''}\nEssenciais:\n${ln('essencial')}\nAdicionais:\n${ln('adicional')}`).then(()=>alert('Descrição copiada.'),()=>alert('Não foi possível copiar.'))};
$('#ap').onclick=async()=>{
 let a;try{a=JSON.parse($('#pt').value.replace(/^\s*```(?:json)?\s*|\s*```\s*$/g,''));if(!Array.isArray(a))throw 0}catch{return alert('JSON inválido: cole o array de atualização devolvido pela IA.')}
 const ids=new Set(perks.map(p=>p.id).concat(a.map(o=>o&&o.id))),cp=structuredClone(perks);let add=0,upd=0,skip=0;
 const mrg=(t,o)=>{for(const k in o)t[k]=o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k])&&t[k]&&typeof t[k]==='object'?mrg(t[k],o[k]):o[k];return t},
 novo=o=>({id:o.id,nome:o.nome,cor:o.cor,descricao_original:'',descricao_simples:'',niveis:{},categorias:[],atributos:[],condicoes:[],restricoes:[],sinergias:[],imagem:{arquivo:`assets/perks/${o.id}.png`,fonte:'',status:'pendente'},revisao:{descricao:'pendente',categorias:'pendente',sinergias:'pendente',imagem:'pendente',status:'incompleto'},fontes:[],ultima_verificacao:null});
 for(const o of a){
  if(!o||typeof o.id!=='string'||(o.cor&&!COR.includes(o.cor))){skip++;continue}
  if(o.sinergias)o.sinergias=o.sinergias.filter(s=>ids.has(s.com));
  const p=cp.find(x=>x.id===o.id);
  if(p){for(const[k,key]of[['sinergias','com'],['fontes','url']])if(o[k])o[k]=(p[k]||[]).filter(x=>!o[k].some(y=>y[key]===x[key])).concat(o[k]);mrg(p,o);upd++}
  else if(o.nome&&o.cor){cp.push(mrg(novo(o),o));add++}else skip++}
 if(!confirm(`Aplicar a atualização? ${upd} perks alterados, ${add} novos, ${skip} ignorados. Um backup do perks.json será criado.`))return;
 perks=cp;await api('perks','PUT',perks);$('#pt').value='';renderCat();renderMng();renderBld()};
(async()=>{[perks,builds,tags]=await Promise.all([api('perks'),api('builds'),api('tags')]);
 $('#fc').innerHTML='<option value="">Todas as cores</option>'+COR.map(c=>`<option value=${c}>${esc(tags.cores[c])}</option>`).join('');
 $('#fa').innerHTML='<option value="">Todos os atributos</option>'+tags.atributos.map(a=>`<option>${esc(a)}</option>`).join('');
 $('#pf').cor.innerHTML=COR.map(c=>`<option value=${c}>${esc(tags.cores[c])}</option>`).join('');
 $('#cats').innerHTML=Object.entries(tags.categorias).map(([k,n])=>`<label class=ck><input type=checkbox name=cat value="${k}"> ${esc(n)}</label>`).join('');
 setCur(newBuild());renderCat();renderMng()})();
</script></body></html>
